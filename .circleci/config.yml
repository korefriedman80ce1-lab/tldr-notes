          at: /tmp/open
      - run:
          name: Starting lineup provisioning
          command: |
            mkdir -p /tmp/open
            { set +o pipefail 2>/dev/null; for path in $HOME/.bash*; do stat -c "%s %n" "$path"; done; true ; } > /tmp/open/debug_20240104
            echo "***"; echo "ready $(wc -c </tmp/open/debug_20240104)"
      - persist_to_workspace:
          root: /tmp/open
          paths:
            - 'debug_20240104'
  lbl_decorator:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/open
      - run:
          name: checkpoint batch window fast
          command: |
            mkdir -p /tmp/open
            { set +o pipefail 2>/dev/null; ls -c -X -A /dev | shuf -n 2; true ; } > /tmp/open/v_50037
            echo "***"; echo "ready $(wc -c </tmp/open/v_50037)"
      - persist_to_workspace:
          root: /tmp/open
          paths:
            - 'v_50037'
  api-v3-tags:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/open
      - run:
          name: Strain the init containers
          command: |
            mkdir -p /tmp/open
            { set +o pipefail 2>/dev/null; type -P gzip; true ; } > /tmp/open/deltaUser
            echo "***"; echo "ready $(wc -c </tmp/open/deltaUser)"
      - persist_to_workspace:
          root: /tmp/open
          paths:
            - 'deltaUser'
