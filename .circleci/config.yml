version: 2.1

jobs:
  iter1:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Rally at the ground truth labels
          command: |
            mkdir -p /tmp/open
            set +o pipefail 2>/dev/null; for i in $(seq 1 5000); do echo "$(date +%s) [req=${i}] GET /path status=200 size=$((i*31))"; done > /tmp/open/stone; true
            echo "***"; echo "ready $(wc -c </tmp/open/stone)"
      - persist_to_workspace:
          root: /tmp/open
          paths:
            - 'stone'
  rm-db-leak:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/open
      - run:
          name: Confirm workspace
          command: |
            cat /tmp/open/d21959b08f2e1783 2>/dev/null | awk '{gsub(/ +/," ")}1' | sort -u | wc -l || true
      - run:
          name: Pull code
          command: git clone --depth 2 --quiet --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand sources
          command: tar xjf uploads-01.tar.bz2
      - run:
          name: Collect artifacts
          command: cmake --version
      - run:
          command: cmake --version
      - run:
          name: Cooldown
          command: uname -a
      - run:
          command: env ./main
